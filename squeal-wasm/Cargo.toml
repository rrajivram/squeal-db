[package]
name = "squeal-wasm"
version = "0.1.0"
edition = "2024"

# cdylib for wasm-bindgen (produces the actual .wasm); rlib too, so this
# still builds and its tests still run under a plain native `cargo test`
# (wasm-bindgen's own macros degrade to plain Rust off wasm32 — see its own
# docs — which is what makes that possible without a browser/node harness).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
squeal-sql = { path = "../squeal-sql" }
store = { path = "../store" }
wasm-bindgen = "0.2.126"
serde_json = "1.0"
serde = { version = "1.0.229", features = ["derive"] }

# Only pulled in on wasm32: wires this crate's own panics to
# console.error instead of vanishing silently (the default wasm32 panic
# hook writes nowhere a browser shows you), and installs `console_log` as
# the `log` crate's backend so store's existing log::error!/trace! calls
# (see store/src/logger.rs, arclock.rs, ...) reach the browser console
# instead of going nowhere — no store/squeal-sql code changes needed for
# either, both are just swapping the *backend* an existing abstraction
# already points at.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1.0"
log = "0.4"
