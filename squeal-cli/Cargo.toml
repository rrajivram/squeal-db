[package]
name = "squeal-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
comfy-table = "8.0.0"
rustyline = "18.0.1"
squeal-sql = {path="../squeal-sql"}
store = {path="../store"}
dhat = { version = "0.3", optional = true }

[features]
# Enables store's own dhat-heap feature (which is what actually swaps
# the process's #[global_allocator] to dhat::Alloc — see store/src/
# lib.rs) and, here, constructs the dhat::Profiler guard main() needs
# to hold for the run's duration so it flushes dhat-heap.json on drop.
dhat-heap = ["dep:dhat", "store/dhat-heap"]
