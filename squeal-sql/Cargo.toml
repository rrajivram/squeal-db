[package]
name = "squeal-sql"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1.3"
log = "0.4.33"
parking_lot = "0.12.5"
postcard = "1.1.3"
serde = "1.0.228"
sql-parser = {path="../sql-parser"}
store= {path="../store"}
thiserror = "2.0.18"
macros ={path="../macros"}
either = "1.16.0"
uuid = {version="1.24.1", features=["v4", "js"]}
getrandom = {version="0.4", features=["wasm_js"]}
bloomfilter = "3.0.1"
crossbeam = "0.8.5"
crossbeam-skiplist = "0.1.3"
rand = {version="0.10.2",features=["thread_rng"]}
