[package]
name = "store"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.32"
thiserror = "2.0.18"
env_logger = "0.11.10"
postcard = {version = "1.1.3", features=["alloc"]}
serde = { version="1.0.228", features=["derive","rc"]}
portable-atomic = "1.13.1"
priority-queue = "2.7.0"
atomic_bitfield = "0.1.0"
parking_lot = {version="0.12.5", features=["send_guard","serde"]}
crossbeam = "0.8.4"
memmap = "0.7.0"
mimalloc = "0.1.52"
dhat = { version = "0.3", optional = true }

[features]
# Swaps the #[global_allocator] (see lib.rs) from our own byte-counting
# TrackingAllocator to dhat's — call-site-attributed heap profiling
# instead of just size totals/histogram, at the cost of TrackingAllocator's
# stats() becoming unavailable (dhat writes its own dhat-heap.json instead;
# see squeal-cli's own dhat-heap feature, which drives this one).
dhat-heap = ["dep:dhat"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "page_store"
harness = false
