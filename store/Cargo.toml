[package]
name = "store"
version = "0.1.0"
edition = "2024"

[features]
# Install alloc::TrackingAllocator as the global allocator (see lib.rs).
alloc-tracking = []

[dependencies]
log = "0.4.32"
thiserror = "2.0.18"
env_logger = "0.11.10"
postcard = {version = "1.1.3", features=["alloc"]}
serde = { version="1.0.228", features=["derive","rc"]}
portable-atomic = "1.13.1"
atomic_bitfield = "0.1.0"
parking_lot = {version="0.12.5", features=["send_guard","serde","arc_lock"]}
crossbeam = "0.8.4"
web-time = "1.1.0"
crc32fast = "1.5.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap = "0.7.0"

[dev-dependencies]
criterion = "0.5"
# examples/kv_vs_sqlite.rs only.
rusqlite = { version = "0.40.2", features = ["bundled"] }

[[bench]]
name = "page_store"
harness = false

[[bench]]
name = "arclock"
harness = false
